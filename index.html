:root{
  --mod:#174EA6;--mod2:#0F3A80;--zel:#0A7245;--zel2:#075A36;--cer:#D3121C;
  --ink:#22305A;--pap:#FFF8EC;--pap2:#FFFFFF;--lin:#EBDCC3;--mut:#5C6680;
  --ok:#08663D;--zle:#B3121A;--okb:#DDF3E7;--zleb:#FCE6E6;--sel:#174EA6;
  --disk:#FBFCFE;--lucn:#9DAEC6;
  --serif:'Alegreya',Georgia,serif;--sans:'Baloo 2','Trebuchet MS',sans-serif;--text:'Nunito','Trebuchet MS',sans-serif;
  --zaklad:18px;
}
body.lv-a{--zaklad:20px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--pap);color:var(--ink);font:500 var(--zaklad)/1.55 var(--text);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--sans);font-weight:700;line-height:1.08;margin:0}
p{margin:0 0 .85em}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--sel)}
:focus-visible{outline:3px solid #FFD24A;outline-offset:2px}
i[lang=rom]{font-family:var(--serif);font-style:italic;font-weight:700;font-size:1.08em;color:var(--sel)}
.skry{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* tlačidlá */
.tl{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:48px;padding:.5em 1.25em;border-radius:999px;
  background:#C93A1E;color:#fff;font:700 1.05em/1.1 var(--sans);text-decoration:none;box-shadow:0 3px 0 #94290F;transition:transform .12s}
.tl:active{transform:scale(.97)}
.tl.dru{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 2px var(--lin),0 3px 0 var(--lin)}
.tl:disabled{opacity:.45;cursor:default}
.ik{width:46px;height:46px;border-radius:50%;display:inline-grid;place-items:center;color:inherit}
.ik svg{width:24px;height:24px}
.ik:hover{background:rgb(34 48 90 / .08)}

.lu{cursor:default}.lu .hit{fill:transparent}
.lu .sp{stroke:var(--lucn);stroke-width:3;stroke-dasharray:6 5;stroke-linecap:round}
.lu .bod{fill:var(--lucn)}
.lu.ok .sp{stroke:var(--cer);stroke-width:6;stroke-dasharray:none}.lu.ok .bod{fill:var(--cer)}

.pata-s{padding:14px 0 40px}
.pod-vn{max-width:1060px;margin:auto}
.pod h2{font-size:1.75rem;margin:0 0 .4em}
.sek{margin:0 0 22px}
.sek h3{font-size:1.1rem;color:var(--mut);margin-bottom:4px}
.zoz{list-style:none;margin:0;padding:0}
.zoz button{display:flex;width:100%;gap:.6em;align-items:baseline;padding:.42em 0;text-align:left;border-bottom:1px solid var(--lin);font:500 1.05rem/1.25 var(--sans);min-height:44px}
.zoz button b{font-weight:800;min-width:1.5em;color:var(--mut)}
.zoz li.ok button b{color:var(--cer)}
.zoz .w{margin-left:auto;font:italic 600 1rem var(--serif);color:var(--mut)}
.nav2{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pata{font:500 .92rem/1.4 var(--sans);color:var(--mut);margin-top:28px}

/* zastávka */
.hl{max-width:44rem;margin:0 auto;padding:22px 18px 70px}
.hlas{display:flex;gap:12px;align-items:flex-start;margin:0 0 24px}
.hlas .av{flex:none;width:60px;height:60px;border-radius:50%;background:var(--pap2);display:grid;place-items:center}
.hlas .av svg{width:42px;height:42px}
.hlas .kto{font:800 1rem/1.2 var(--sans)}
.hlas .kto small{font-weight:500;color:var(--mut)}
.hlas p{margin:.15em 0 .3em}
.cit{font:800 .92rem/1 var(--sans);color:var(--sel);text-decoration:underline;min-height:44px;padding:.8em 0}
.hl h2{font-size:1.5rem;margin:1.5em 0 .4em}
.poj{font:inherit;color:inherit;text-decoration:underline dotted 2px;text-underline-offset:3px;cursor:help;display:inline}
.sved{border-left:6px solid var(--cer);font-family:var(--text);padding:.2em 0 .2em 1em;margin:1.3em 0;font-size:1.08em}
.sved cite{display:block;font:500 .86em/1.35 var(--sans);color:var(--mut);margin-top:.4em}
.pas{margin:26px -4px;padding:20px 16px;background:var(--pap2);border-radius:22px;box-shadow:0 3px 0 var(--lin)}
.pas h3{font-size:1.32rem}
.pas .zad{margin:.3em 0 .9em}
.pas.hot h3::after{content:" ✓";color:var(--ok)}
.fb{min-height:1.5em;font:500 1rem/1.35 var(--sans);margin-top:.8em}
.fb.ok{color:var(--ok)}.fb.zle{color:var(--zle)}
.tras{animation:tras .3s}
@keyframes tras{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ch{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:.4em .9em;border-radius:999px;background:var(--pap);box-shadow:inset 0 0 0 2px var(--lin);font:500 1em/1.2 var(--sans);text-align:center}
.ch.rom{font:italic 700 1.08em/1.2 var(--serif)}
.ch.sel{box-shadow:inset 0 0 0 3px var(--sel);background:color-mix(in srgb,var(--sel) 14%,var(--pap))}
.ch.ok{background:var(--okb);box-shadow:inset 0 0 0 2px var(--ok)}
.ch.zle{background:var(--zleb);box-shadow:inset 0 0 0 2px var(--zle)}
.ch:disabled{cursor:default}
.rad{display:flex;flex-wrap:wrap;gap:8px}
.mc{display:grid;gap:8px}
.mc .ch{border-radius:12px;justify-content:flex-start;text-align:left;padding:.55em .9em}
.otz{font:800 1.12rem/1.25 var(--sans);margin:0 0 .6em}
.otz i{font-family:var(--serif)}
.par{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.par>div{display:grid;gap:8px;align-content:start}
.par .ch{border-radius:12px;width:100%}
.kosy{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
.kos{min-height:96px;border-radius:12px;box-shadow:inset 0 0 0 2px var(--lin);padding:8px;text-align:left;background:var(--pap);display:block;width:100%}
.kos b{display:block;font:800 1rem/1.15 var(--sans);margin-bottom:5px}
.kos .v{display:block;font:500 .88rem/1.25 var(--sans);color:var(--ok)}
.por{counter-reset:p;display:grid;gap:6px;margin:0 0 12px;padding:0;list-style:none}
.por li{font:500 1rem/1.25 var(--sans);padding:.3em 0;border-bottom:1px solid var(--lin)}
.por li b{color:var(--ok);margin-right:.4em}
.txt-sp{line-height:2}
.txt-sp button{padding:.1em .15em;border-radius:6px;display:inline}
.txt-sp button:hover{background:color-mix(in srgb,var(--sel) 14%,transparent)}
.txt-sp .opr{color:var(--ok);font-weight:700;text-decoration:underline}
.vst{width:100%;min-height:48px;font:600 1.1rem var(--serif);padding:.5em .7em;border-radius:10px;border:2px solid var(--lin);background:var(--pap);color:var(--ink)}
textarea.vst{min-height:110px;font-weight:400;line-height:1.4}
.klv{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.klv button{width:44px;height:44px;border-radius:10px;background:var(--pap);box-shadow:inset 0 0 0 2px var(--lin);font:italic 700 1.1em var(--serif)}
.bod-r{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;min-height:50px;max-width:320px}
.bod-r i{width:22px;height:22px;border-radius:50%;background:var(--cer)}
.vd{height:0;overflow:hidden}.vd[open]{height:auto}
.stl{margin:.6em 0;font:500 .96rem/1.35 var(--sans)}
.stl .pr{height:26px;background:var(--mod);border-radius:0 6px 6px 0;min-width:3px;transition:width .6s}
.stl:nth-child(even) .pr{background:var(--zel)}
.vel{font:900 2.2rem/1 var(--sans)}
.dv{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:14px}
.dv p{font:500 .95rem/1.3 var(--sans);margin:.3em 0 0}
details.nap{margin-top:12px;font:500 1rem/1.35 var(--sans)}
details.nap summary{cursor:pointer;color:var(--sel);min-height:44px;display:flex;align-items:center}
.akc{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.akc .tl{font-size:.95em;min-height:44px}
.mapa{position:relative}
.mapa svg{display:block;width:100%;height:auto}
.mapa .sus{fill:color-mix(in srgb,var(--ink) 12%,var(--pap))}
.mapa .tr{fill:none;stroke:var(--mut);stroke-width:7;stroke-dasharray:15 11;stroke-linecap:round}
.mapa .tr.on{stroke:var(--cer);stroke-dasharray:none}
.uz{cursor:pointer}
.uz .h{fill:transparent}.uz .b{fill:var(--pap);stroke:var(--cer);stroke-width:7;transition:r .2s}
.uz.on .b{fill:var(--cer)}.uz text{fill:var(--ink);font:800 32px var(--sans);text-anchor:middle;paint-order:stroke;stroke:var(--pap2);stroke-width:7px}
.uz:focus-visible .b{stroke:#FFD24A}.uz:focus{outline:none}
.mapa .sk{fill:color-mix(in srgb,var(--zel) 22%,var(--pap));stroke:var(--zel);stroke-width:3}
.pin{cursor:pointer}.pin .h{fill:transparent}.pin .b{fill:var(--pap);stroke:var(--cer);stroke-width:6}.pin.on .b{fill:var(--cer)}
.pin:focus-visible .b{stroke:#FFD24A}.pin:focus{outline:none}
.mst{margin-top:10px;min-height:7.5em}
.mst-z{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lnk{font:800 1rem/1.2 var(--sans);text-decoration:underline;text-underline-offset:3px;min-height:44px;display:inline-flex;align-items:center;color:#fff}
.lnk.pill{background:#fff;color:var(--ink);text-decoration:none;padding:.4em 1em;border-radius:999px}
.mst b{font-family:var(--sans)}
.leg{margin-top:12px;font:500 .98rem/1.35 var(--sans);display:grid;gap:2px}
.leg i{font-weight:700;font-family:var(--serif)}
.vb{width:min(100%,300px);display:block;margin:0 auto 12px;box-shadow:0 0 0 2px var(--lin);border-radius:3px}
.ludia{list-style:none;margin:24px 0 0;padding:0;border-top:2px solid var(--ink)}
.ludia li{border-bottom:1px solid var(--lin)}
.ludia .hd{display:flex;gap:12px;align-items:center;width:100%;min-height:68px;padding:8px 0;text-align:left}
.ludia .zn{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--mod);color:#fff}
.ludia li:nth-child(even) .zn{background:var(--zel)}
.ludia .zn svg{width:28px;height:28px}
.ludia .mn{font:900 1.28rem/1.05 var(--sans);display:block}

.hlas{margin-bottom:22px}
.pas,.zav{margin:26px calc(var(--pd)*-1) 0!important;padding:22px var(--pd)!important;border-radius:0;box-shadow:none}
.pas>*,.zav>*{max-width:48rem}
.pas{background:#fff}
.pas:nth-of-type(even){background:#E9F4FF}
.ludia li{box-shadow:none;border:2px solid var(--lin)}
.ludia,.pop{max-width:48rem}
.odk{max-width:48rem}
.dalsi{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px;max-width:48rem}
.dalsi .tl:last-child{flex:1 1 220px}
@media (min-width:760px){.zast{--pd:clamp(24px,3.4vw,52px)}}
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .zast{display:grid;grid-template-columns:minmax(340px,40%) minmax(0,1fr)}
  .bok{display:flex;flex-direction:column;position:sticky;top:0;height:100svh;overflow:hidden;background:var(--mod)}
  .lis{position:static}
  .bok-sc{flex:none;width:100%}
  .bok-t{flex:1;padding:20px clamp(18px,3vw,36px)}
  .bok-t h1{font-size:clamp(2.2rem,4vw,3.6rem)}
  .hl{padding-top:30px}
}
.str{max-width:none;margin:0;padding-inline:clamp(16px,4vw,56px)}
.opak{padding-left:1.1em}.opak li{margin:.7em 0}.opak b{display:block;font-family:var(--sans)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

     `Na začiatku 15. storočia cestovali Európou skupiny s [[ochranný list|ochrannými listami]]. Rómovia pracovali ako kováči a hudobníci a mnohí slúžili v uhorských vojskách. Po bitke pri Moháči v roku 1526 sa ich postavenie zhoršilo.`],
  c:[`Tu sa dátumy rozchádzajú a je dobré vedieť prečo. Slovenské zdroje považujú za prvú zmienku záznam zo Spiša z roku 1322. Rada Európy uvádza ako prvý nespochybnený doklad v Uhorsku rok 1416 z Brašova. Ide o rôzne meradlá: čo sa považuje za zmienku a čo za istý dôkaz.`,
     `Podobne je to s listinou kráľa Žigmunda z roku 1423 pre Ladislava a jeho ľudí, vydanou na Spiši. ERIAC ju pripomína ako ochranný dekrét a jej kópiu dnes má Dom európskej histórie. István Kemény však uvádza, že historik Pál Nagy ju označil za falzifikát.`,
     `Palatín Juraj Thurzo v roku 1612 prikázal Rómov vyhnať a v roku 1616 inej skupine vydal ochranný list, lebo potreboval ich vojenské služby. Postavenie Rómov záviselo od toho, kto vládol a čo práve potreboval.`]},
 ulohy:{
  a:[{t:'sort',n:'Kováč alebo hudobník?',zad:'Ťukni na vec a potom na toho, kto ju potrebuje.',kosy:['Kováč','Hudobník'],k:4,items:[['kladivo',0],['kovadlina',0],['klince',0],['mechy',0],['husle',1],['cimbal',1],['sláčik',1],['struny',1]]}],
  b:[{t:'order',n:'Čo bolo skôr?',zad:'Zoraď udalosti od najstaršej. Ťukaj postupne.',k:4,items:[[1322,'Spišský záznam, ktorý sa u nás považuje za prvú zmienku'],[1388,'V listinách sa spomína dedina Ciganvaja'],[1423,'Kráľ Žigmund vydáva listinu pre Ladislava'],[1526,'Bitka pri Moháči'],[1616,'Thurzov ochranný list']]},
     {t:'sort',n:'Čím sa živili?',zad:'Roztrieď doklady z listín.',kosy:['Remeslo','Hudba','Vojsko'],k:5,items:[['Výroba zbraní a nábojov',0],['Kováčstvo',0],['Práca s kovom',0],['Hra na cimbal na dvore kráľovnej',1],['Hudba pre šľachtu',1],['Služba v uhorskej armáde',2],['Vojenské služby pre palatína',2]]}],
  c:[{t:'mc',n:'Rozchádzajúce sa dátumy',zad:'Ako by si napísal text panelu, aby bol pravdivý?',k:2,qs:[
       {q:'Čo je najpresnejšia formulácia o roku 1322?',a:['U nás sa za prvú zmienku považuje záznam zo Spiša z roku 1322, medzinárodné prehľady uvádzajú ako istý doklad až neskoršie dátumy','Rómovia prišli na Slovensko presne v roku 1322','Rok 1322 je vymyslený'],w:'Dobrý text uvedie, čo sa považuje za zmienku, a nezatají rozdiel medzi zdrojmi.'},
       {q:'Čo urobíš s listinou z roku 1423, keď jej pravosť niektorí historici spochybňujú?',a:['Uvediem ju aj s poznámkou o spochybnení','Vynechám to, aby text pôsobil isto','Vyhlásim ju za falzifikát bez ďalšieho'],w:'Čitateľ má vedieť, čo je isté a o čom sa vedci sporia.'},
       {q:'Prečo mohol Thurzo Rómov raz vyháňať a inokedy chrániť?',a:['Záležalo na tom, kto bol užitočný a čo žiadali miestni obyvatelia','Thurzo žil dvakrát','Oba dokumenty sú z rôznych storočí'],w:'Rada Európy ukazuje, že postavenie skupín záviselo od ich služieb aj od nálady obyvateľstva.'}]}]},
 otazky:[
  {l:'abc',q:'Akými remeslami sa často živili Rómovia v Uhorsku?',a:['Kováčstvom a hudbou','Rybolovom na mori','Výrobou papiera'],w:'Listiny spomínajú prácu s kovom a hudobníkov.'},
  {l:'ab',q:'Ako dlho žijú Rómovia na našom území?',a:['Viac ako 600 rokov','Asi 50 rokov','Až od roku 2000'],w:'Prvé zmienky siahajú do 14. storočia.'},
  {l:'a',q:'Čo potrebuje kováč?',a:['Kladivo','Sláčik','Struny'],w:'Kováč pracuje s kovom.'},
  {l:'bc',q:'Čo bol ochranný list?',a:['Listina, ktorá zaručovala bezpečný pohyb po krajine','Štít proti šípom','List do školy'],w:'Vydávali ho panovníci a šľachtici.'},
  {l:'bc',q:'Kde podľa ERIAC vznikla Žigmundova listina z roku 1423?',a:['Na Spiši','V Madride','V Londýne'],w:'Bola vydaná pre vojvodu Ladislava a jeho ľudí.'},
  {l:'c',q:'Ktorý doklad uvádza Rada Európy ako prvý nespochybnený v Uhorsku?',a:['Rok 1416 v Brašove','Rok 1322 na Spiši','Rok 1616 od Thurza'],w:'Záznam z Brašova hovorí o „pánovi Emausovi z Egypta“ a 120 spoločníkoch.'}],

{id:'zor',s:'h',n:'Okovy a zákazy',slovo:['zor','sila'],
 intro:['Päť storočí otroctva.','Zatýkanie v jednej noci.','Zákaz vlastnej reči.'],veta:'Uvidíš, ako sa štáty pokúšali Rómov ovládnuť.',
 pribeh:{
  a:`Čiri je smutný. „Babka mi povedala, že kedysi boli ľudia k Rómom veľmi nespravodliví. Chceš to vedieť?“`,
  b:`V zošite je podčiarknuté slovo *zor*, sila. Vierka sa pýta babky, načo Rómovia potrebovali toľko sily.`,
  c:`Tretí panel chváli Máriu Teréziu za „pomoc Rómom“. Adam si prečíta jej nariadenia a nadpis prepíše.`},
 text:{
  a:[`V niektorých krajinách boli Rómovia dlho otrokmi. Nesmeli ísť, kam chceli, a ich pán ich mohol predať.`,`Aj v Uhorsku, kam kedysi patrilo dnešné Slovensko, platili prísne zákazy. Panovníci zakazovali hovoriť po rómsky a brali deti rodičom. Bolo to veľmi nespravodlivé.`,`Rómovia si napriek tomu zachovali svoj jazyk.`],
  b:[`Vo [[Valašsko|Valašsku]] a [[Moldavsko|Moldavsku]] boli Rómovia otrokmi takmer 500 rokov. Patrili kniežaťu, kláštorom alebo šľachte. Prvý doklad je z roku 1385. Otroctvo sa skončilo až v rokoch 1855 a 1856.`,
     `V Španielsku sa 30. júla 1749 začalo zatýkanie Rómov v celej krajine naraz. Zadržali 9 až 12 tisíc ľudí.`,
     `V Uhorsku vydala Mária Terézia štyri [[dekrét|dekréty]]. Rómov mali volať „noví občania“, nesmeli vlastniť kone ani voz a od roku 1773 im brali deti. Jozef II. dal v roku 1783 za rómčinu trest 24 úderov. Tomuto tlaku hovoríme [[asimilácia]]. Otroctvo vo Valašsku a Moldavsku a nariadenia v Uhorsku boli rozdielne veci: tam boli ľudia majetkom, tu ich štát nútil vzdať sa jazyka a spôsobu života.`],
  c:[`Prvý doklad o Rómoch severne od Dunaja je zároveň prvým dokladom otroctva: roku 1385 daroval vojvoda Dan I. kláštoru Tismana 40 rómskych rodín. Otrok nebol právna osoba, ale majetok. Rada Európy pripomína aj Ștefana Răzvana, ktorý sa z otroctva dostal až na kniežací stolec v roku 1595. Išlo o výnimku, nie o pravidlo.`,
     `V polovici 19. storočia žilo v oboch kniežatstvách asi 250 až 300 tisíc Rómov, teda okolo 7,5 % obyvateľov. Po zrušení otroctva mnohí odišli do strednej a západnej Európy aj do Ameriky.`,
     `[[osvietenský absolutizmus|Osvietenskí panovníci]] telesné násilie čiastočne nahradili ničením kultúry. Rada Európy hodnotí ich metódy, napríklad odoberanie detí, ako v mnohom ešte krutejšie. Trvalo to uspelo len v dnešnom Burgenlande. Inde Rómovia nariadeniam vzdorovali alebo sa im vyhli.`]},
 ulohy:{
  a:[{t:'truth',n:'Bolo to spravodlivé?',zad:'Keď pravidlo platí pre všetkých rovnako, je spravodlivé. Rozhodni.',ano:'Spravodlivé',nie:'Nespravodlivé',k:4,items:[
      {x:'Človeka nikto nesmie predať.',f:1,w:'Správne. Každý človek je slobodný.'},
      {x:'Dieťa nesmie doma rozprávať svojou rečou.',f:0,w:'Každý má právo na svoj materinský jazyk.'},
      {x:'Deti zoberú rodičom, lebo sú z inej skupiny.',f:0,w:'Pôvod nikdy nie je dôvod.'},
      {x:'Všetky deti môžu chodiť do školy.',f:1,w:'Škola patrí všetkým deťom.'},
      {x:'Niekoho potrestajú za to, ako sa volá.',f:0,w:'Za svoje meno nikto nemôže byť potrestaný.'}]}],
  b:[{t:'sort',n:'Kde sa to stalo?',zad:'Priraď udalosť ku krajine.',kosy:['Valašsko a Moldavsko','Španielsko','Habsburská monarchia'],k:6,items:[
      ['Otroctvo od 14. storočia',0],['Slobodu priniesli zákony z rokov 1855 a 1856',0],['Otrokov vlastnili kláštory a šľachta',0],
      ['Veľké zatýkanie 30. júla 1749',1],['Zákaz rómčiny v roku 1633',1],
      ['Pomenovanie „noví občania“',2],['Trest 24 úderov za rómčinu',2],['Odoberanie detí po roku 1773',2]]}],
  c:[{t:'order',n:'Dekréty a ich dôsledky',zad:'Zoraď kroky od najstaršieho.',k:5,items:[[1758,'Povinnosť usadiť sa, zákaz koní a voza'],[1761,'Nové pomenovanie „noví občania“'],[1767,'Zrušenie súdnej moci vojvodov a povinná registrácia'],[1773,'Zákaz manželstiev medzi Rómami, odoberanie detí'],[1783,'Trest za používanie rómčiny za Jozefa II.']]},
     {t:'spot',n:'Oprav text panelu',zad:'V texte sú tri chybné slová. Ťukni na ne.',pool:[
       {x:'Mária Terézia sa Rómom snažila [pomôcť|ich prispôsobiť väčšine], preto im [darovala|zakázala vlastniť] kone a [podporila|obmedzila] manželstvá medzi Rómami.'},
       {x:'Otroctvo Rómov vo Valašsku trvalo [50|takmer 500] rokov a skončilo sa v [18.|19.] storočí, keď o oslobodení rozhodli [cirkvi|kniežatá a zhromaždenia].'}]}]},
 otazky:[
  {l:'abc',q:'Čo znamená, že Rómovia boli otrokmi?',a:['Patrili pánovi a ten ich mohol predať','Mali platenú prácu','Mohli odísť, kedy chceli'],w:'Otrok nemal slobodu ani práva.'},
  {l:'a',q:'Zakázali kedysi niektorí vládcovia hovoriť po rómsky?',a:['Áno, a bolo to nespravodlivé','Nie, nikdy','Áno, a bolo to správne'],w:'Každý má právo na svoj jazyk.'},
  {l:'a',q:'Môže jeden človek vlastniť druhého?',a:['Nie, každý človek je slobodný','Áno','Len v nedeľu'],w:'Otroctvo je zakázané.'},
  {l:'bc',q:'Ako dlho trvalo otroctvo vo Valašsku a Moldavsku?',a:['Takmer 500 rokov','10 rokov','Až do roku 2000'],w:'Od 14. storočia do rokov 1855 a 1856.'},
  {l:'bc',q:'Čo znamená asimilácia?',a:['Tlak, aby sa menšina vzdala jazyka a zvykov','Oslava sviatku','Sťahovanie vtákov'],w:'Mária Terézia a Jozef II. ju presadzovali nariadeniami.'},
  {l:'c',q:'Kde sa nútená asimilácia podľa Rady Európy trvalo presadila?',a:['V dnešnom Burgenlande','V celom Uhorsku','V Španielsku'],w:'Inde Rómovia nariadeniam vzdorovali a štát ich nevedel presadiť.'},
  {l:'c',q:'Aký bol dôsledok zrušenia otroctva v 19. storočí?',a:['Mnohí Rómovia odišli do strednej a západnej Európy aj do Ameriky','Všetci sa vrátili do Indie','Hneď získali pôdu a školy'],w:'Hovorí sa o druhej migrácii Rómov.'}],
 zdroje:['coeWal','coeAH','coeSp','loc']},

/* 4 ------------------------------------------------------------- */
{id:'pamat',s:'h',n:'Pamäť',ticho:1,slovo:['ma bisteren','nezabudnime'],
 intro:['Táto zastávka je tichá.','Nemá body ani časomieru.','Pripomíname si ľudí.'],veta:'Prejdi ňou pomaly. Môžeš sa o nej porozprávať s dospelým.',
 pribeh:{
  a:`Čiri sa posadil a nespieva. „Toto je zastávka, kde sme potichu. Babka hovorí, že niektoré veci nesmieme zabudnúť.“`,
  b:`Pri tejto strane babka nič nenapísala. Je tam len meno, dátum a dve slová: *Ma bisteren*. Nezabudnime.`,
  c:`Pri tomto paneli Adam nepotrebuje tvrdenia, ale presnosť. Čísla sa rozchádzajú a každý rozdiel treba vysvetliť.`},
 text:{
  a:[`Počas veľkej vojny vládli v Nemecku a v ďalších krajinách ľudia, ktorí nenávideli celé národy. Prenasledovali Židov aj Rómov.`,`Veľa ľudí prišlo o domov, o rodinu aj o život. Stalo sa to len preto, kým boli.`,`Na tých ľudí spomíname 2. augusta. Pamätať si je dôležité, aby sa to už nikdy nestalo.`],
  b:[`Počas druhej svetovej vojny nacistické Nemecko a jeho spojenci vyvraždili podľa odhadov najmenej 250-tisíc Rómov, možno až 500-tisíc. Rómovia toto obdobie volajú [[porajmos]], „požieranie“, alebo [[samudaripen]].`,
     `Do tábora Auschwitz-Birkenau deportovali asi 23-tisíc Rómov. V noci z 2. na 3. augusta 1944 tam Nemci zavraždili posledných väzňov rómskeho tábora. Preto si 2. augusta Európa pripomína obete rómskeho holokaustu.`,
     `Aj v Slovenskej republike boli Rómovia prenasledovaní. Museli do [[pracovný útvar|pracovných útvarov]], vyháňali ich z obcí a koncom vojny ich vraždili pri masových popravách.`],
  c:[`Presný počet obetí nepoznáme. Pred vojnou chýbali spoľahlivé údaje o počte Rómov a [[genocída]] bola dlho prehliadaná. USHMM uvádza najmenej 250-tisíc, možno až 500-tisíc obetí. Nemecko oficiálne uznalo genocídu Sintov a Rómov až v roku 1982.`,
     `V Slovenskej republike sa perzekúcie začali v roku 1939: vykazovanie do domovských obcí, zákaz obchodu s koňmi, zákaz kočovania, od roku 1941 pracovné útvary. Po potlačení povstania vznikol v Dubnici nad Váhom [[zaisťovací tábor]]. Pri kapacite 300 ľudí tam bolo až 729 Rómov, z toho 250 detí. 23. februára 1945 tam Nemci zavraždili 26 ľudí. ÚPN uvádza, že rómskych obetí bolo na Slovensku stovky a že Rómovia zo Slovenskej republiky neboli transportovaní do nemeckých koncentračných táborov.`,
     `Európsky parlament vyhlásil 2. august za pamätný deň v roku 2015. Podľa prehľadu OBSE, ktorý cituje Rada Európy, ho Slovensko zatiaľ oficiálne nevyhlásilo a pripomínajú ho najmä múzeá a rómske organizácie.`]},
 svedectvo:{l:'bc',x:`„V jeden deň prišli do tábora nákladné autá s nemeckými vojakmi. Chorým povedali, že ich berú do nemocnice. V skutočnosti ich odviezli k veľkým jamám, kde ich postrieľali a zahrabali.“`,z:'Spomienka Heleny Surmajovej na tábor v Dubnici nad Váhom, zachytil Ústav pamäti národa'},
 ulohy:{
  a:[{t:'reflect',n:'Čo môžem urobiť ja',zad:'Tu nie je správna ani nesprávna odpoveď. Vyber, čo by si urobil alebo urobila, keď sa niekomu deje krivda.',op:['Zastanem sa ho','Poviem to dospelému','Budem pri ňom, aby nebol sám','Opýtam sa, ako mu môžem pomôcť']}],
  b:[{t:'miesta',n:'Miesta pamäti na Slovensku',zad:'Ťukni na miesto a prečítaj si, čo sa tam stalo. Otvor aspoň tri.',k:3},
     {t:'reflect',n:'Tvoje slová',zad:'Prečo si myslíš, že je dôležité spomínať na ľudí, ktorých sme nepoznali? Napíš jednu vetu. Text ostáva len v tomto zariadení.',pis:1}],
  c:[{t:'dvecisla',n:'Dve čísla, jedna noc',zad:'Prečítaj si oba údaje. Potom vyber, ako by mal text výstavy znieť.'},
     {t:'miesta',n:'Miesta pamäti na Slovensku',zad:'Prejdi miesta a všimni si, ako sa o obetiach hovorí pri každom z nich. Otvor aspoň tri.',k:3},
     {t:'reflect',n:'Na zamyslenie',zad:'Elena Lacková písala o tejto téme už koncom 40. rokov, desaťročia pred oficiálnym uznaním. Čo podľa teba znamená, keď sa o krivde dlho mlčí? Napíš pár viet. Text ostáva len v tomto zariadení.',pis:1}]},
 otazky:[
  {l:'abc',q:'Čo znamená Ma bisteren?',a:['Nezabudnime','Dobrý deň','Ďakujem'],w:'Rovnako sa volá slovenský projekt, ktorý označuje miesta prenasledovania Rómov.'},
  {l:'abc',q:'Ktorý deň si Európa pripomína obete rómskeho holokaustu?',a:['2. august','5. november','8. apríl'],w:'Európsky parlament ho vyhlásil v roku 2015.'},
  {l:'a',q:'Prečo si spomíname na ľudí z minulosti?',a:['Aby sa nespravodlivosť už nezopakovala','Aby sme sa báli','Lebo to tak chce škola'],w:'Pamäť nás chráni pred opakovaním krivdy.'},
  {l:'bc',q:'Čo znamená slovo porajmos?',a:['Požieranie','Oslava','Cesta'],w:'Používa sa aj slovo samudaripen.'},
  {l:'c',q:'Prečo nepoznáme presný počet obetí?',a:['Chýbajú spoľahlivé predvojnové údaje a genocída bola dlho prehliadaná','Nikto sa o to nezaujímal ani dnes','Záznamy existujú, ale sú tajné'],w:'Preto sa uvádza rozpätie najmenej 250 až 500-tisíc.'}],
 zdroje:['ushmm','ushmm2','abm','enrs','upn','coeGen','tasrLac']},

/* 5 ------------------------------------------------------------- */
{id:'opre',s:'h',n:'Opre Roma!',slovo:['opre','hore, vstaňte'],
 intro:['Jedna vlajka.','Jedna hymna.','Jedno vlastné meno.'],veta:'Spoznáš, ako sa Rómovia začali organizovať.',
 pribeh:{
  a:`Čiri letí nad vlajkou. „Modrá, zelená, červené koleso! Vieš ju poskladať?“`,
  b:`Babka má v zošite nalepenú malú vlajku. Vierka zisťuje, že tento symbol je starší, než si myslela.`,
  c:`Panel uvádza: „Medzinárodná rómska únia vznikla v roku 1971.“ Adam našiel článok, podľa ktorého ide o častý omyl.`},
 text:{
  a:[`Rómovia majú svoju vlajku. Hore je modrá ako obloha, dole zelená ako zem. V strede je červené koleso.`,`Koleso pripomína Indiu aj dlhú cestu. Má 16 lúčov.`,`Majú aj svoju hymnu a sviatok. Medzinárodný deň Rómov je 8. apríla.`],
  b:[`Na jar 1971 sa pri Londýne stretol prvý svetový kongres Rómov. Delegáti schválili vlajku, hymnu Gelem, gelem a pomenovanie Rom namiesto urážlivých slov. Vlajka pochádza z kongresu v Bukurešti z roku 1933, červené koleso pridali v roku 1971. Význam farieb a kolesa sa vysvetľuje rôznymi spôsobmi.`,
     `Na Slovensku vznikol 27. apríla 1969 Zväz Cigánov-Rómov. Zanikol násilne v roku 1973. Slobodne hlásiť sa k rómskej národnosti mohli ľudia až po roku 1989. V roku 1991 boli Rómovia uznaní za [[národnostná menšina|národnostnú menšinu]].`,
     `Výzva *Opre Roma!* znamená „Hor sa, Rómovia!“. K medzinárodnému hnutiu výrazne prispel lekár Ján Cibuľa z Klenovca.`],
  c:[`Kongres sa konal od 7. do 12. apríla 1971 pri Orpingtone, kľúčové zasadnutie bolo 8. apríla. Rómovia ešte nikde nemali uznaný holokaust a mnohé štáty ich chceli asimilovať. Vznikli preto pracovné skupiny pre školstvo, sociálne veci a odškodnenie.`,
     `Hymnu napísal hudobník Žarko Jovanović na melódiu rómskych ľudových piesní. V Československu sa dlho nepresadila: Zväz bol v roku 1973 rozpustený a za normalizácie sa emancipácia potláčala. Až po roku 1989 sa pieseň vrátila do povedomia.`,
     `V Československu vládla asimilácia aj po vojne. Zákon č. 74/1958 Zb. nariadil trvalé usídlenie kočujúcich osôb a v praxi ťažko zasiahol najmä [[olašskí Rómovia|olašských Rómov]]. Na Slovensku bol formálne zrušený až v roku 2004.`,
     `Národná rada SR prijala v roku 2022 pracovnú definíciu [[anticiganizmus|anticiganizmu]] podľa IHRA.`]},
 ulohy:{
  a:[{t:'flag',n:'Zlož vlajku',zad:'Vyber farbu pre hornú časť, potom pre dolnú a nakoniec pridaj koleso.'}],
  b:[{t:'flag',n:'Zlož vlajku',zad:'Vyber farby a pridaj koleso. Pri každej časti sa dozvieš, čo znamená.'},

{id:'cib',s:'j',n:'Slová ako mapa',slovo:['čhib','jazyk'],
 intro:['Viac ako tisíc starých slov.','Žiadne arabské.','Jedna jazyková mapa.'],veta:'Rozoberieš rómčinu na vrstvy ako geológ.',
 pribeh:{
  a:`Čiri našiel v babkinej zásuvke kartičky so slovami. „Pomôžeš mi spojiť ich s tým, čo znamenajú?“`,
  b:`*Čhib* znamená jazyk. Vierka si všimne, že babkine slová vyzerajú ako poskladané z rôznych krajín. A naozaj sú.`,
  c:`Panel tvrdí: „Väčšina rómskych slov je z Európy, takže rómčina je európsky jazyk.“ Adam vie, že to tak jednoducho nie je.`},
 text:{
  a:[`Každý jazyk si požičiava slová. V slovenčine máme „futbal“ z angličtiny. Rómčina si požičala slová od ľudí, ktorých stretla na ceste.`,`Najstaršie slová sú tie najdôležitejšie: mama, otec, brat, sestra, slnko, ruka.`,`Rómčina má aj svoj sviatok. Svetový deň rómskeho jazyka je 5. novembra.`],
  b:[`[[rómčina|Rómčina]] patrí medzi [[indoárijské jazyky]], je príbuzná s hindčinou. Po rómsky sa volá *romaňi čhib*.`,
     `Slovná zásoba má dve časti. Staršia je predeurópska: podľa odhadov v materiáloch Rady Európy asi 700 [[slovný základ|slovných základov]] z Indie, najviac 100 z perzštiny, aspoň 20 z arménčiny a do 250 z gréčtiny. Mladšia je európska a v každom [[nárečie|nárečí]] iná.`,
     `Svetový deň rómskeho jazyka pripadá na 5. november. Prvýkrát ho oslávili v Záhrebe v roku 2009 a v roku 2015 ho na žiadosť Chorvátska vyhlásilo [[UNESCO]].`],
  c:[`V jednotlivých nárečiach tvoria väčšinu slov európske prevzatia. Základná slovná zásoba, teda telo, rodina, príroda, čísla, je však väčšinou indická. Práve podľa nej a podľa gramatiky rómčinu radíme medzi indoárijské jazyky. List Rady Európy to prirovnáva k angličtine: germánska je len asi tretina jej slov, no ide o tú základnú.`,
     `Z gréčtiny nepochádzajú len slová. Rómčina prevzala aj časti gramatiky, napríklad koncovky prevzatých slov. V každej krajine sa navyše mohlo stať slovom ktorékoľvek slovo kontaktného jazyka.`,
     `Svetový deň rómskeho jazyka sa začal v Chorvátsku. V roku 2008 tam pri predstavení slovníka Veljka Kajtaziho podpísali chartu o Dni rómskeho jazyka. V Záhrebe v roku 2009 ho Medzinárodná rómska únia a združenie Kali Sara navrhli pre všetky krajiny a v roku 2015 ho vyhlásilo [[UNESCO]].`]},
 ulohy:{
  a:[{t:'pairs',n:'Spoj slovo s významom',zad:'Ťukni na rómske slovo a potom na to, čo znamená.',k:4,rom:1,pool:[['daj','mama'],['dad','otec'],['phral','brat'],['phen','sestra'],['kham','slnko'],['paňi','voda'],['kher','dom'],['drom','cesta']]}],
  b:[{t:'layers',n:'Vrstvy jazyka',zad:'Odhadni, z ktorej krajiny má rómčina po Indii najviac starých slov. Potom si pozri čísla.'},
     {t:'sort',n:'Roztrieď podľa pôvodu',zad:'Priraď slovo k jazyku, z ktorého pochádza.',kosy:['India','Perzia','Grécko'],k:6,items:[['daj (mama)',0],['kham (slnko)',0],['phral (brat)',0],['ambrol (hruška)',1],['bacht (šťastie)',1],['angušto (prst)',1],['drom (cesta)',2],['foros (mesto)',2],['kurko (týždeň)',2]]}],
  c:[{t:'reflect',n:'Prečo na tom záleží',zad:'Prečo je dôležité zachovávať a rozvíjať jazyky národnostných menšín? Uveď dva argumenty. Text ostáva len v tomto zariadení.',pis:1},
     {t:'layers',n:'Vrstvy jazyka',zad:'Odhadni, z ktorého jazyka má rómčina po indickej vrstve najviac starých základov. Potom si pozri čísla.'},
     {t:'mc',n:'Prečo indoárijský jazyk?',zad:'Vyber najlepší argument.',k:2,qs:[
       {q:'Podľa čoho radíme rómčinu medzi indoárijské jazyky, hoci v nárečiach prevládajú európske prevzatia?',a:['Podľa základnej slovnej zásoby a gramatiky','Podľa počtu všetkých slov v slovníku','Podľa krajiny, kde sa ňou hovorí'],w:'Rovnako angličtina ostáva germánska, hoci veľa slov prevzala z francúzštiny a latinčiny.'},

{id:'pozdrav',s:'j',n:'Prvé slová',slovo:['paľikerav','ďakujem'],

  a:`Čiri cvičí pred zrkadlom: *Lačho ďives!* „Babka sa poteší, keď ju takto pozdravím. Skúsime to spolu?“`,
  b:`Vierka prvýkrát píše babke po rómsky. Lenže ako sa rozlúčiť? V zošite sú dva rôzne pozdravy.`,
  c:`Adam chce na vernisáži privítať hostí po rómsky. Pýta sa rómskej lektorky, koho môže osloviť ako a čo sa považuje za slušné.`},
 text:{
  a:[`*Lačho ďives!* znamená Dobrý deň. *Paľikerav* znamená ďakujem. Keď niekto povie *Paľikerav*, odpovieme *Nane vaš soske*, teda Nemáš za čo.`],
  b:[`Slová v tejto zastávke sú zapísané podľa učebných materiálov severocentrálnej rómčiny.`,`Pri lúčení je dôležité, kto odchádza. Kto zostáva, povie tomu, kto ide: *Džan Devleha!*, doslova „Choďte s Bohom“. Kto odchádza, odpovie: *Ačhen Devleha!*, „Zostaňte s Bohom“. Jednej blízkej osobe povieš *Dža Devleha* alebo *Ačh Devleha*.`],
  c:[`Učebné materiály Karlovej univerzity opisujú tradičné vykanie takto: staršia cudzia osoba mladšiemu tyká a mladší jej vyká. Neplatí to rovnako vo všetkých rodinách a komunitách.`,`Pozdrav je aj kultúrna otázka. Tie isté materiály uvádzajú, že návštevu sa patrí pohostiť, no dávať najavo hlad nie je pokladané za slušné. Je to príklad z konkrétneho prostredia, nie pravidlo pre všetkých Rómov.`,`Rómčinu ako vyučovací predmet upravuje na Slovensku štandard Štátneho pedagogického ústavu. Predmet sa dá absolvovať aj na maturite.`]},

     `Aj rodina je mapa. Mama, otec, brat, sestra, syn a dcéra sú indické slová. Staršia generácia je grécka, *papus*, starý otec. Strýko a teta, *kak* a *bibi*, sú najskôr z perzštiny.`],
  c:[`Rovnako ako 7, 8, 9 sú grécke aj 30 a 40. Slová *rom* a *romňi* znamenajú aj manžel a manželka. List Rady Európy pripomína častý omyl: *rom* neznamená „človek“. Na človeka sa používa slovo *manuš*.`,

{id:'lav',s:'j',n:'Písmo a nárečia',slovo:['lav','slovo'],
 intro:['Jazyk z úst.','Prvé pravidlá v roku 1971.','Štandard v roku 2008.'],veta:'Zistíš, ako sa z hovoreného jazyka stal aj písaný.',
 pribeh:{
  a:`Čiri skúša vysloviť *kher*. „Babka hovorí, že v tom je malý dych, ako keď fúkaš na okno.“`,
  b:`Vierka si všimne, že babka píše *buťi*, ale hovorí *buči*. Je to chyba? Babka sa usmeje.`,
  c:`Panel tvrdí: „Rómčina nemá pravidlá, každý píše, ako chce.“ Adam nájde prvý dokument z roku 1971 a dátum 2008.`},
 text:{
  a:[`Rómčina sa dlho odovzdávala najmä rozprávaním. Spoločné pravidlá písania vznikli oveľa neskôr.`,`Rómčina má zvláštne hlásky: *ph, th, kh, čh*. Vyslovíš ich s malým dychom za spoluhláskou. *Kher* je dom.`],
  b:[`Rómčina sa po stáročia odovzdávala najmä ústne. Písalo sa v nej aj skôr, no spoločné pravidlá chýbali. V roku 1971 prijala jazyková komisia pri Zväze Cigánov-Rómov prvé pravidlá pravopisu. Boli základom pre systematickejšie písanie a vyučovanie. V roku 2008 bola na Slovensku vyhlásená [[štandardizácia]] rómčiny. Základom jej spisovnej podoby je východoslovenská varianta.`,
     `Rómovia na Slovensku hovoria tromi hlavnými nárečiami: rumungro, olašským a maďarským. V Európe sa rozlišujú balkánske, valašské, stredné a severné nárečia.`,
     `Dych niekedy mení význam: *kher* je dom, ale *ker!* znamená rob!`],
  c:[`Rada Európy opisuje rómčinu ako primárne ústny jazyk bez všeobecne prijatej písomnej normy pre všetky krajiny. To súvisí s postavením jej hovoriacich: Rómovia dlho nemali štát ani inštitúcie, ktoré spisovný jazyk zvyčajne vytvárajú.`,
     `Pravopis severocentrálnej rómčiny používa tzv. interdialektný princíp. Píše sa *ďives* (deň) a *džives* (žiješ), hoci na Spiši a Šariši sa to vyslovuje rovnako. Autorka pravidiel Milena Hübschmannová pripomínala, že každý Róm môže písaný text čítať po svojom a je to správne.`,
     `Rómčina nie je slabší jazyk. Rada Európy pripomína, že každý jazyk dokáže vyjadriť to, čo jeho hovoriaci potrebujú, a rómčina sa používaním rozširuje aj do odborných oblastí.`]},
 ulohy:{
  a:[{t:'mc',n:'Počúvaj dych',zad:'Rómske hlásky ph, th, kh a čh majú po sebe malý dych. V ktorom slove je dych?',k:3,qs:[{q:'Ktoré slovo má dych? Znamená dom.',a:['kher','gav','drom'],w:'V slove kher je kh.'},{q:'Ktoré slovo má dych? Znamená slnko.',a:['kham','rat','lav'],w:'V slove kham je kh.'},{q:'Ktoré slovo má dych? Znamená brat.',a:['phral','dad','daj'],w:'V slove phral je ph.'},{q:'Ktoré slovo má dych? Znamená mlieko.',a:['thud','gav','foros'],w:'V slove thud je th.'}]}],
  b:[{t:'pairs',n:'Dvojice',zad:'Spoj rok alebo pojem s vysvetlením.',k:4,pool:[['1971','Prvé pravidlá pravopisu'],['2008','Štandardizácia na Slovensku'],['kher','Dom'],['ker!','Rob!'],['ďives','Deň']]},
     {t:'mc',n:'Babkin pravopis',zad:'Prečo môže babka písať buťi, ale hovoriť buči?',k:1,qs:[{q:'Čo je správne?',a:['Pravopis platí pre viac nárečí, každý ho môže čítať po svojom','Babka robí chybu','Rómčina nemá pravidlá'],w:'Na Spiši a Šariši sa tieto hlásky vyslovujú rovnako, ale píšu sa rozdielne.'}]}],
  c:[{t:'spot',n:'Oprav text panelu',zad:'V texte sú tri chybné slová. Ťukni na ne.',pool:[
       {x:'Rómčina [nemá|má] pravidlá pravopisu, na Slovensku od roku 1971. Jej štandardizácia tu bola vyhlásená v roku [1989|2008] a hovorí sa ňou [jedným|viacerými] nárečiami.'},
       {x:'Podľa pravopisu sa *ďives* a *džives* píšu [rovnako|rozdielne], lebo ide o [ten istý|iný] význam, a Rómovia ich [musia|môžu] čítať po svojom.'}]},
     {t:'mc',n:'Prečo nie je jedna spisovná rómčina?',zad:'Vyber najlepšie vysvetlenie.',k:1,qs:[{q:'Podľa Rady Európy súvisí chýbajúca jednotná norma predovšetkým s tým, že:',a:['Rómovia nemali štát a inštitúcie, ktoré spisovný jazyk bežne vytvárajú','Rómčina je príliš jednoduchá','Rómovia o norme nemali záujem'],w:'Jazykové normy zvyčajne vznikajú s politickými a hospodárskymi štruktúrami.'}]}]},
 otazky:[
  {l:'abc',q:'Čo je zvláštne na hláskach ph, th, kh, čh?',a:['Vyslovujú sa s malým dychom','Sú tiché','Píšu sa veľkým'],w:'Tieto hlásky sú typické pre indoárijské jazyky.'},
  {l:'a',q:'Čo znamená kher?',a:['Dom','Rob','Pes'],w:'Keď vynecháš dych, slovo ker znamená rob!'},

{id:'rom',s:'k',n:'Kto sú Rómovia?',slovo:['rom','muž, Róm'],
 intro:['Nie jeden, ale mnoho ľudí.','Nie Egypt, ale India.','Vlastné meno.'],veta:'Rozlúčiš sa s najčastejšími mýtmi.',
 pribeh:{
  a:`„Ako sa volajú ľudia, s ktorými sa babka rozpráva?“ pýta sa Čiri. „A prečo je dôležité volať ich správne?“`,
  b:`Vierka počula v autobuse urážlivé slovo. Príde domov a pýta sa, odkiaľ sa vzalo. Babka otvorí zošit pri slove *rom*.`,
  c:`Adam dostal od návštevníka výstavy otázku: „Veď všetci Rómovia sú rovnakí, nie?“ Pripravuje odpoveď s konkrétnymi dôkazmi.`},
 text:{
  a:[`Rómovia sú ľudia ako všetci ostatní. Sú medzi nimi učitelia, lekári, hudobníci, vodiči aj športovci.`,`Sami sa volajú *Roma*. Je slušné a správne hovoriť Rómovia. Volať niekoho menom, ktoré sa mu nepáči, ho môže raniť.`],
  b:[`Slovo Rómovia je [[endonymum|vlastné pomenovanie]]. Pomenovania ako Cigán, Gypsy alebo Zigeuner dali Rómom iní, sú to [[exonymum|exonymá]]. Ich význam sa líši podľa krajiny a doby a môžu byť urážlivé. Cigán a Zigeuner sa zvyčajne odvodzujú z gréckeho Athinganoi, Gypsy z mylnej predstavy, že Rómovia prišli z Egypta.`,
     `Rómovia nie sú jedna rovnaká skupina. Sú medzi nimi [[Sinti]], [[Manuš|Manuši]], [[Kale]], [[Rumungri]] aj [[olašskí Rómovia]]. Väčšina Rómov na Slovensku žila po stáročia usadene. Predstava, že všetci Rómovia kočujú, je mýtus.`],
  c:[`*Roma* je množné číslo slova *rom* a používajú ho najmä skupiny v strednej a východnej Európe. Sinti ho pre seba zvyčajne neprijímajú. Rada Európy preto používa širší termín Rómovia a kočovníci a upozorňuje, že ide o mnoho rôznorodých skupín.`,
     `Rómovia patria medzi najpočetnejšie menšiny v Európe, Rada Európy uvádza 10 až 12 miliónov v členských štátoch. Sú občanmi svojich krajín a nemajú vlastný štát.`,
     `Exonymá sú témou aj pre vedu. Bežné vysvetlenie ich odvodzuje z gréckeho *athinganoi* (nedotknuteľní) a *egyptani*. Jazykovedec Yaron Matras však zvažuje turecký pôvod. Rada Európy pripomína, že o Athinganoch toho vieme málo.`,
     `Etnológ Arne Mann ukazuje, že kultúra nie je uzavretá. Aj slovenská kultúra preberala zvyky od iných. Hľadať „čisto rómsky“ alebo „čisto slovenský“ prvok preto často nemá zmysel.`]},
 ulohy:{
  a:[{t:'truth',n:'Pravda alebo nie?',zad:'Rozhodni.',ano:'Pravda',nie:'Nie',k:4,items:[
      {x:'Rómovia sú rovnakí ľudia ako všetci ostatní.',f:1,w:'Každý je človek so svojím menom a príbehom.'},
      {x:'Všetci Rómovia vedia hrať na husliach.',f:0,w:'Niektorí vedia, iní nie. Rovnako ako všetci ľudia.'},
      {x:'Rómovia majú vlastný jazyk.',f:1,w:'Volá sa rómčina.'},
      {x:'Rómske deti chodia do školy ako ostatné deti.',f:1,w:'Každé dieťa má právo na školu.'},
      {x:'Rómovia pochádzajú z Egypta.',f:0,w:'Pochádzajú z Indie.'}]}],
  b:[{t:'truth',n:'Mýtus alebo fakt?',zad:'Rozhodni.',ano:'Fakt',nie:'Mýtus',k:5,items:[
      {x:'Všetci Rómovia kočujú.',f:0,w:'Väčšina Rómov na Slovensku žila po stáročia usadene.'},
      {x:'Rómovia pochádzajú z Egypta.',f:0,w:'Pochádzajú z Indie. Omyl vznikol v stredoveku.'},
      {x:'Sinti sú rómska skupina.',f:1,w:'Žijú najmä v nemecky hovoriacich krajinách a používajú vlastné meno Sinti.'},
      {x:'Slovo Rom znamená človek.',f:0,w:'Znamená muž, manžel. Človek je manuš.'},
      {x:'Na Slovensku sú rôzne rómske skupiny.',f:1,w:'Napríklad Rumungri a olašskí Rómovia.'},
      {x:'Rómovia majú vlastnú vlajku a hymnu.',f:1,w:'Prijali ich v roku 1971.'}]}],
  c:[{t:'sort',n:'Vlastné meno, alebo meno od iných?',zad:'Roztrieď pomenovania.',kosy:['Endonymum','Exonymum'],k:6,items:[['Rom',0],['Sinti',0],['Kale',0],['Manuš',0],['Romaničal',0],['Zigeuner',1],['Gypsy',1],['Gitano',1],['Cigán',1],['Athinganoi',1]]},
     {t:'mc',n:'Odpoveď návštevníkovi',zad:'Čo je najlepšia, vecná odpoveď na otázku „Veď všetci Rómovia sú rovnakí, nie?“',k:1,qs:[{q:'Vyber odpoveď.',a:['Nie: sú to rôzne skupiny s rôznymi nárečiami, dejinami a skúsenosťami','Áno, ale nesmie sa to hovoriť','Nie, lebo Rómovia sú lepší než ostatní'],w:'Dobrá odpoveď stojí na faktoch a nestavia jeden predsudok proti druhému.'}]}]},
 otazky:[
  {l:'abc',q:'Ako je slušné a správne hovoriť?',a:['Rómovia','Egypťania','Indovia'],w:'Pomenovanie Rom si Rómovia zvolili sami.'},
  {l:'a',q:'Čo môže raniť človeka?',a:['Keď ho voláme menom, ktoré sa mu nepáči','Keď ho pozdravíme','Keď sa ho spýtame, ako sa má'],w:'Oslovuj ľudí tak, ako sa sami volajú.'},
  {l:'a',q:'Majú všetci Rómovia rovnaké záľuby?',a:['Nie, každý je iný','Áno, všetci rovnaké','Iba v škole'],w:'Každý človek je iný.'},
  {l:'bc',q:'Čo je endonymum?',a:['Meno, ktoré si skupina dala sama','Meno, ktoré jej dali iní','Názov mesta'],w:'Napríklad Rom, Sinto alebo Kale.'},
  {l:'bc',q:'Ako sa volá pomenovanie človeka, ktorý nie je Róm?',a:['gadžo','phral','manuš'],w:'Ženský tvar je gadži.'},
  {l:'c',q:'Koľko Rómov žije podľa Rady Európy v jej členských štátoch?',a:['10 až 12 miliónov','Asi 100-tisíc','Viac ako 100 miliónov'],w:'Sú jednou z najpočetnejších menšín Európy.'},
  {l:'c',q:'Prečo Sinti často nechcú byť nazývaní Roma?',a:['V ich nárečí slovo rom neznamená príslušníka skupiny','Nepáči sa im písmeno R','Nehovoria žiadnym jazykom'],w:'Preto sa používa viacslovné „Sinti a Rómovia“.'}],
 zdroje:['coeJaz','coeIndia','ra_sin','romea','coeInc','rusn','mann']},

{id:'gili',s:'k',n:'Hudba sveta',slovo:['giľi','pieseň'],
 intro:['Uhorsko.','Španielsko.','Paríž.'],veta:'Spoznáš hudbu, ktorá zmenila Európu.',
 pribeh:{
  a:`Čiri si píska pesničku. „Hudba letí po celom svete, aj bez krídel! Poďme zistiť, kde všade.“`,
  b:`Pri slove *giľi* má babka napísané: „Pieseň je pamäť.“ Vierka hľadá, kde všade rómski hudobníci zanechali stopu.`,
  c:`Adam chystá hudobný panel. Vie, že za hudbou sa často skrýva stereotyp „nadaní od prírody“. Ako to napísať lepšie?`},
 text:{
  a:[`Rómski hudobníci hrali v mnohých krajinách. Hudbu sa učili doma v rodine aj od iných hudobníkov.`,`V Španielsku tancujú [[flamenco]]. V Paríži hral gitarista Django. U nás hrala slávna huslistka Cinka Panna.`],
  b:[`[[verbunkos|Verbunkos]] je uhorská tanečná hudba, ktorú od 18. storočia preslávili rómski hudobníci. Pôvodne slúžila pri verbovaní vojakov. Jedným z prvých slávnych kapelníkov bol János Bihari.`,
     `[[UNESCO]] zapísalo [[flamenco]] v roku 2010 do zoznamu nehmotného dedičstva. Jeho domovom je podľa UNESCO Andalúzia, korene má aj v Murcii a Extremadure. Rómske spoločenstvo Gitanos zohralo v jeho vývoji zásadnú úlohu, no nebolo jeho jediným tvorcom.`,
     `Django Reinhardt spojil v Paríži jazz s rómskou hudobnou tradíciou. Esma Redžepova priniesla rómske piesne na veľké pódiá.`],
  c:[`Nevšímame si len krásu, ale aj to, kto o nej rozhoduje. RomArchive pripomína, že podiel rómskych umelcov na flamenku sa dlho neuznával. Podobne postava Carmen z novely Prospera Mériméeho vytvorila sexualizovaný stereotyp rómskej ženy.`,
     `Hudba bola aj práca. Rada Európy dokladá, že rómski hudobníci hrávali na dvoroch už v 16. storočí a ich služby ovplyvňovali, ako sa k nim úrady správali. Tvrdenie „majú to v krvi“ znie ako pochvala, ale popiera ich tréning, učenie a remeslo.`]},
 ulohy:{
  a:[{t:'pairs',n:'Kde sa to hrá?',zad:'Spoj hudbu s krajinou alebo mestom.',k:3,pool:[['Flamenco','Španielsko'],['Jazzová gitara Djanga','Paríž'],['Husle Cinky Panny','Gemer']]}],
  b:[{t:'pairs',n:'Hudba a jej ľudia',zad:'Spoj štýl s človekom alebo miestom.',k:4,pool:[['Verbunkos','János Bihari'],['Flamenco','Carmen Amaya'],['Gypsy jazz','Django Reinhardt'],['Čhaje Šukarije','Esma Redžepova'],['Gemer','Cinka Panna']]},
     {t:'truth',n:'Pravda alebo nie?',zad:'Rozhodni.',ano:'Pravda',nie:'Nie',k:3,items:[
      {x:'Verbunkos súvisel s verbovaním vojakov.',f:1,w:'Názov pochádza z nemeckého slova Werben.'},
      {x:'Flamenco je zapísané v zozname UNESCO.',f:1,w:'Od roku 2010.'},
      {x:'Každý Róm sa rodí ako hudobník.',f:0,w:'Hudbe sa treba učiť. Je to remeslo aj talent konkrétnych ľudí.'},
      {x:'Django hral rovnako ako pred úrazom.',f:0,w:'Po požiari vymyslel nový spôsob hry.'}]}],
  c:[{t:'mc',n:'Prepíš vetu',zad:'Vyber vetu, ktorá stereotyp nahrádza faktom.',k:2,qs:[
      {q:'Pôvodná veta: „Rómovia majú hudbu v krvi.“',a:['Hudba bola po stáročia rodinným remeslom a zdrojom obživy mnohých rómskych rodín.','Všetci Rómovia sú rodení umelci.','Rómovia nevedia nič iné len hrať.'],w:'Fakt hovorí o práci a učení, nie o vrodenej vlastnosti celého národa.'},
      {q:'Pôvodná veta: „Vášnivá Carmen je typická Rómka.“',a:['Postava Carmen je literárny výmysel, ktorý sa stal stereotypom.','Carmen je dokumentárny záznam.','Carmen ukazuje skutočný život rómskych žien.'],w:'RomArchive upozorňuje na skreslený a sexualizovaný obraz.'},
      {q:'Čo znamená, že podiel rómskych umelcov na flamenku „sa málo uznáva“?',a:['Umenie je známe, no ich autorstvo sa často nepripomína','Flamenco nie je známe','Rómovia nikdy netancovali'],w:'Tvrdí to projekt RomArchive vo svojej časti o flamenku.'}]}]},
 otazky:[
  {l:'abc',q:'Ktorý tanec vznikol v Španielsku?',a:['Flamenco','Polka','Valčík'],w:'Rómovia v ňom zohrali zásadnú úlohu.'},
  {l:'a',q:'Na čom hrala Cinka Panna?',a:['Na husliach','Na bubne','Na klavíri'],w:'Bola slávna huslistka z Gemera.'},
  {l:'a',q:'Čo je giľi?',a:['Pieseň','Dom','Cesta'],w:'Množné číslo je giľa.'},
  {l:'bc',q:'Na čo slúžil verbunkos pôvodne?',a:['Pri verbovaní vojakov','Pri uspávaní detí','V kostole'],w:'Názov sa spája s nemeckým Werben.'},
  {l:'bc',q:'Kedy zapísalo UNESCO flamenco?',a:['V roku 2010','V roku 1971','V roku 1423'],w:'Zápis pripomína rómske spoločenstvo Gitanos.'},
  {l:'c',q:'Čo je problém vety „majú to v krvi“?',a:['Prehliada učenie, prácu a rozdiely medzi ľuďmi','Je gramaticky nesprávna','Je príliš dlhá'],w:'Aj pochvala môže byť stereotyp.'}],

{id:'kher',s:'k',n:'Rómovia na Slovensku dnes',slovo:['kher','dom'],
 intro:['Tri rôzne čísla.','Divadlo a múzeum.','Práva, ktoré sa stále dopĺňajú.'],veta:'Budeš čítať čísla kriticky.',
 pribeh:{
  a:`Čiri pristál na streche divadla. „Babka ma sem chce vziať. Vieš, kde sa hrá po rómsky?“`,
  b:`Vierka má do školy zistiť, koľko Rómov žije na Slovensku. Našla tri rôzne čísla. Ktoré je správne?`,
  c:`Posledný panel o súčasnosti je najťažší. Adam chce ukázať údaje aj úspechy a odlíšiť, čo platí pre Slovensko a čo pre celú Európu.`},
 text:{
  a:[`V Košiciach je profesionálne rómske divadlo Romathan. V Martine je Múzeum kultúry Rómov na Slovensku.`,`Rómske deti aj dospelí žijú v mnohých mestách a dedinách. Sú našimi susedmi, spolužiakmi a kolegami.`],
  b:[`Divadlo Romathan vzniklo v Košiciach v roku 1992. Múzeum kultúry Rómov na Slovensku vzniklo v roku 2004 pri Slovenskom národnom múzeu v Martine.`,
     `Pri [[sčítanie obyvateľov|sčítaní]] v roku 2021 uviedlo rómsku národnosť 1,2 % obyvateľov a rómčinu ako materinský jazyk 100 526 ľudí. Atlas rómskych komunít však odhaduje oveľa viac. Rozdiel vzniká preto, že národnosť si každý uvádza sám.`],
  c:[`Údaje Agentúry EÚ pre základné práva z prieskumu 2024 hovoria o Rómoch a kočovníkoch v 10 krajinách EÚ a troch kandidátskych krajinách. Slovensko v tomto prieskume nebolo. V sledovaných krajinách žije v chudobe 70 % z nich a 46 % detí chodí do školy, kde sú všetci alebo väčšina žiakov Rómovia. Starší prieskum FRA z roku 2021 uvádza školskú [[segregácia|segregáciu]] ako problém najmä v Bulharsku a na Slovensku.`,
     `Rómske ženy boli v Československu a na Slovensku v rokoch 1966 až 2004 protiprávne sterilizované. Európsky súd pre ľudské práva rozhodol o prvom prípade v roku 2011. Vláda SR sa ospravedlnila v novembri 2021. Podľa Poradne pre občianske a ľudské práva štát k januáru 2026 stále nezaviedol systémové odškodnenie. Stav si preto vždy over.`,
     `Fakt a dojem treba rozlišovať. Údaj o chudobe je výsledkom diskriminácie a nerovných podmienok, nie vlastnosťou ľudí. FRA hovorí o dôsledkoch anticiganizmu.`]},
 ulohy:{

  b:[`[[ústna slovesnosť|Ústna slovesnosť]] je základ rómskej kultúry. Rómčina bola dlho hlavne hovoreným jazykom, preto sa príbehy, piesne a spomienky odovzdávali rozprávaním.`,
     `Na Slovensku vydal Dezider Banga v roku 1969 rozprávky Čierny vlas. V roku 1992 vyšla autorská kniha Eleny Lackovej Rómske rozprávky.`],
  c:[`Rómska literatúra na území bývalého Československa stále čerpá z ústnej tradície a z „orálneho myslenia“, ako upozorňujú výskumníci. Zároveň sa od folklóru posúva k individuálnemu písaniu.`,
     `Zápis priniesol ďalšiu otázku: kto zapisuje a pre koho? Prvé zbierky rómskych rozprávok a piesní zaznamenávali najmä nerómski bádatelia. Práca Mileny Hübschmannovej s rómskymi autormi zase viedla k tradícii dvojjazyčných vydaní, ktoré môžu čítať Rómovia aj ich susedia.`]},

       {q:'Čo sa pri zápise rozprávky stráca najviac?',a:['Hlas, gesto a reakcia publika v danej chvíli','Dej príbehu','Všetky mená'],w:'Text uchová slová, nie celé predstavenie.'},

  b:[`Dejiny písanej rómskej literatúry v Československu sa začínajú koncom 40. rokov hrou Eleny Lackovej. Noviny Zväzu Cigánov-Rómov Románo ľil dali v rokoch 1969 až 1973 priestor ďalším autorom. Patrili k nim Andrej Giňa, Tera Fabiánová, Andrej Pešta a Elena Lacková.`,
     `Veľmi pomohla [[romistika|romistka]] Milena Hübschmannová, ktorá autorov povzbudzovala písať po rómsky.`],
  c:[`Po zrušení zväzu v roku 1973 sa vydávanie takmer zastavilo. Po roku 1989 vznikli časopisy Romano nevo ľil, Amaro lav a ďalšie. V roku 2009 vznikol na Slovensku literárny klub Rolik a od roku 2010 publikuje autorov platforma Kher.`,
     `Pri čítaní si všímaj, kto rozhoduje o vydaní. Lackovej pamäti vyšli česky v roku 1997, anglicky v roku 2000. Slovenské knižné vydanie Narodila som sa pod šťastnou hviezdou má záznam v Slovenskej národnej knižnici z roku 2022.`,
     `Na rómsku literatúru sa treba pozerať ako na súbor literatúr v rôznych jazykoch: Ceija Stojka písala po nemecky, Maximoff vydával po francúzsky, Banga písal po slovensky a neskôr prekladal do rómčiny.`]},

       {q:'Ktorý nadpis je najférovejší?',a:['Prvá publikovaná rómska poetka v Poľsku zaplatila za zverejnenie vylúčením','Rómovia nenávidia poéziu','Ficowski je hrdina príbehu'],w:'Nadpis opisuje fakt a nezovšeobecňuje.'}]},

function ruka(sx,sy,p,o,str){
 const f={dole:[str*4,26],mava:[str*14,-20],hore:[str*8,-27],vpred:[str*17,8],bok:[str*14,14],ob:[str*-4,20]}[p]||[str*4,26];
 const tr=o.tr||o.sat;
 const pr=(o.rk&&str===1)?`<g transform="translate(${f[0]},${f[1]})">${RK[o.rk]||''}</g>`:'';
 return `<g transform="translate(${sx},${sy})"><g class="${p==='mava'?'mav':''}${o.pohyb&&str===1?' '+o.pohyb:''}"><path d="M0 0Q${f[0]*.2+str*3} ${f[1]*.55} ${f[0]} ${f[1]}" fill="none" stroke="${tr}" stroke-width="6.5" stroke-linecap="round"/><circle cx="${f[0]}" cy="${f[1]}" r="3.7" fill="${o.pl}"/>${pr}</g></g>`}

function hlava(o,cy,r){
 const c=o.vl,x=[];
 if(o.ucs==='dl')x.push(`<path d="M${-r-2} ${cy+1}C${-r-5} ${cy+24} ${-r+1} ${cy+29} ${-r+6} ${cy+26}L${r-6} ${cy+26}C${r-1} ${cy+29} ${r+5} ${cy+24} ${r+2} ${cy+1}Z" fill="${c}"/>`);
 if(o.ucs==='ch')x.push(`<path d="M${r-2} ${cy-4}C${r+13} ${cy-5} ${r+12} ${cy+15} ${r+5} ${cy+19}C${r+6} ${cy+9} ${r+3} ${cy+4} ${r-2} ${cy+4}Z" fill="${c}"/>`);
 x.push(`<circle cx="${-r}" cy="${cy+1}" r="2.6" fill="${o.pl}"/><circle cx="${r}" cy="${cy+1}" r="2.6" fill="${o.pl}"/><circle cy="${cy}" r="${r}" fill="${o.pl}"/>`);
 const cap=`M${-r-.6} ${cy+1}C${-r} ${cy-r-3} ${r} ${cy-r-3} ${r+.6} ${cy+1}C${r-5} ${cy-6} ${-3} ${cy-8} ${-r-.6} ${cy+1}Z`;
 if(o.ucs==='sa'){x.push(`<path d="M${-r-1.5} ${cy+3}C${-r-1} ${cy-r-4} ${r+1} ${cy-r-4} ${r+1.5} ${cy+3}C${r-5} ${cy-5} ${-r+5} ${cy-5} ${-r-1.5} ${cy+3}Z" fill="${o.satka||FAR.kor}"/><circle cx="${r+1}" cy="${cy+5}" r="2.8" fill="${o.satka||FAR.kor}"/>`)}
 else if(o.ucs==='pl'){x.push(`<path d="M${-r} ${cy-1}q-2 -6 3 -8M${r} ${cy-1}q2 -6 -3 -8" stroke="${c}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`)}
 else if(o.ucs==='ku'){x.push(`<g fill="${c}">`+[-11,-6,0,6,11].map((a,i)=>`<circle cx="${a}" cy="${cy-r+[5,0,-2,0,5][i]}" r="6.2"/>`).join('')+`</g>`)}
 else x.push(`<path d="${cap}" fill="${c}"/>`);
 if(o.ucs==='ko')x.push(`<circle cy="${cy-r-3}" r="5.5" fill="${c}"/>`);
 if(o.ucs==='vr')x.push(`<g fill="${c}"><circle cx="${-r-3}" cy="${cy+7}" r="4.5"/><circle cx="${-r-2}" cy="${cy+14}" r="3.6"/><circle cx="${r+3}" cy="${cy+7}" r="4.5"/><circle cx="${r+2}" cy="${cy+14}" r="3.6"/></g><circle cx="${-r-2}" cy="${cy+18}" r="1.8" fill="${FAR.cer}"/><circle cx="${r+2}" cy="${cy+18}" r="1.8" fill="${FAR.cer}"/>`);
 if(o.klob)x.push(`<ellipse cy="${cy-r+3}" rx="${r+6}" ry="3" fill="${o.klob}"/><path d="M${-r+3} ${cy-r+3}V${cy-r-7}H${r-3}V${cy-r+3}Z" fill="${o.klob}"/>`);
 if(o.koruna)x.push(`<path d="M-9 ${cy-r+2}L-9 ${cy-r-7}L-4 ${cy-r-2}L0 ${cy-r-9}L4 ${cy-r-2}L9 ${cy-r-7}L9 ${cy-r+2}Z" fill="${FAR.slnko}" stroke="#D99A1C"/>`);
 const us=o.ticho?`<path d="M-3 ${cy+6.5}h6" stroke="#5B3418" stroke-width="1.5" stroke-linecap="round" fill="none"/>`:`<path d="M-4 ${cy+5}Q0 ${cy+9.5} 4 ${cy+5}" stroke="#5B3418" stroke-width="1.6" stroke-linecap="round" fill="none"/>`;
 x.push(`<g class="oci" fill="#2B1D18"><circle cx="-5" cy="${cy+1}" r="1.9"/><circle cx="5" cy="${cy+1}" r="1.9"/></g><g fill="#F08C78" opacity=".55"><circle cx="-8.5" cy="${cy+5}" r="2.6"/><circle cx="8.5" cy="${cy+5}" r="2.6"/></g>${us}`);
 if(o.okul)x.push(`<g fill="none" stroke="#2E3A59" stroke-width="1.3"><circle cx="-5" cy="${cy+1}" r="4"/><circle cx="5" cy="${cy+1}" r="4"/><path d="M-1 ${cy+1}h2"/></g>`);
 if(o.fuz)x.push(`<path d="M-5 ${cy+4.5}Q0 ${cy+2} 5 ${cy+4.5}Q0 ${cy+7} -5 ${cy+4.5}Z" fill="${c}"/>`);
 return x.join('')}

/* postava: nohy sú v bode x,y. vek: k (dieťa), d (dospelý) */
function pst(a={}){
 const o={x:0,y:0,s:1,fl:0,vek:'d',pl:PL.a,vl:VL.c,ucs:'kr',sat:FAR.neb,dol:'n',d:FAR.ink,lr:'dole',pr:'dole',cl:'kyv',...a};
 const k=o.vek==='k',pasY=k?-15:-30,ramY=k?-34:-60,r=k?14.5:13.5,hy=k?-48:-75,w=k?10:12;
 const t=[];
 if(o.dol==='s')t.push(`<path d="M${-w+2} ${ramY+12}L${-w-7} ${k?-5:-8}Q0 ${k?-1:-3} ${w+7} ${k?-5:-8}L${w-2} ${ramY+12}Z" fill="${o.d}"/>`);
 const nh=k?15:(o.dol==='s'?10:30);
 t.push(`<g fill="${o.dol==='s'?o.pl:o.d}"><rect x="-8" y="${-nh}" width="6.5" height="${nh}"/><rect x="1.5" y="${-nh}" width="6.5" height="${nh}"/></g><g fill="#3A2C2A"><ellipse cx="-5.5" cy="-.5" rx="6" ry="3"/><ellipse cx="5.5" cy="-.5" rx="6" ry="3"/></g>`);
 const naz=ruka(-w+1,ramY+3,o.lr,o,-1);
 t.push(naz,`<rect x="${-w}" y="${ramY}" width="${w*2}" height="${-ramY+pasY+(o.dol==='s'?-4:6)}" rx="8" fill="${o.sat}"/>`);
 t.push(hlava(o,hy,r),ruka(w-1,ramY+3,o.pr,o,1));
 return `<g transform="translate(${o.x},${o.y}) scale(${o.fl?-o.s:o.s},${o.s})"><g class="${o.cl}">${t.join('')}</g></g>`}

function bust(o,bg){const k=o.vek==='k';return `<svg viewBox="${k?'-24 -74 48 48':(o.brk?'-31 -101 62 62':'-25 -100 50 50')}" aria-hidden="true"><rect x="-30" y="-110" width="60" height="110" fill="${bg||'none'}"/>${pst({...o,lr:'dole',pr:o.bpr||'dole',rk:o.brk})}</svg>`}

const slnko=(x,y,r=26)=>`<g transform="translate(${x},${y})"><g class="toc" stroke="#F6BE3B" stroke-width="4" stroke-linecap="round">${[0,45,90,135,180,225,270,315].map(a=>`<path d="M0 ${-r-7}V${-r-15}" transform="rotate(${a})"/>`).join('')}</g><circle r="${r}" fill="#F6BE3B"/></g>`;

UL.riddle={nova:1,run(b,t,c){

    shuffle([q,...shuffle(sk.filter(x=>x!==q)).slice(0,2)]).forEach(o=>{const e=ch(o.m,0,()=>{if(o===q){e.classList.add('ok');$$('.ch',r).forEach(x=>x.disabled=true);c.ok(`Áno, ${q.m}.`);n++;if(n<qs.length)b.append(el('div',{cls:'akc'},el('button',{cls:'tl',on:{click:()=>{c.info('');dal()}}},'Ďalej')));else c.hotovo()}else{e.classList.add('zle');e.disabled=true;c.zle('Ešte raz si prečítaj nápovedu.',e)}});r.append(e)});

/* záverečné otázky zastávky */
function zaver(z,box){
  const lv=S.lv,tich=!!z.ticho,qs=shuffle(z.otazky.filter(q=>q.l.includes(lv))).slice(0,3);let n=0;
  const hl=el('h2',{},tich?'Na záver':'Záverečné otázky');
  const pl=el('div');box.replaceChildren(hl,pl);
  const dal=()=>{if(n>=qs.length)return kon();const q=qs[n];pl.replaceChildren(el('p',{cls:'mal'},`Otázka ${n+1} z ${qs.length}`),el('p',{cls:'otz'},q.q));
    const r=el('div',{cls:'mc'}),fb=el('div',{cls:'fb','aria-live':'polite'});let p=false;
    shuffle(q.a.map((x,i)=>[x,i])).forEach(([x,i])=>{const e=ch(x,0,()=>{if(p)return;
      if(i===0){p=true;e.classList.add('ok');fb.className='fb ok';fb.textContent=q.w;beep(1,tich);n++;pl.append(el('div',{cls:'akc'},el('button',{cls:'tl',on:{click:dal}},n<qs.length?'Ďalšia otázka':'Dokončiť')))}
      else{e.disabled=true;e.classList.add('zle');fb.className='fb zle';fb.textContent=tich?'Skús sa vrátiť k textu vyššie.':'Skús ešte raz.';beep(0,tich)}});r.append(e)});
    pl.append(r,fb)};
  const kon=()=>{const nove=!S.done[lv][z.id];S.done[lv][z.id]=1;uloz();const pc=hotove().length;
    pl.replaceChildren(el('div',{cls:'pec'},el('div',{cls:'vel',lang:'rom'},el('i',{},z.slovo[0])),
      el('p',{style:'margin-top:.3em'},`${z.slovo[1][0].toUpperCase()+z.slovo[1].slice(1)}. ${tich?'Toto slovo si odnášaš.':'Slovo je v tvojom zozname.'} Na kolese je ${pc} ${sk(pc,'lúč','lúče','lúčov')} zo 16.`),
      el('div',{cls:'akc'},el('a',{cls:'tl',href:'#/'},'Na koleso'),pc===16?el('a',{cls:'tl',href:'#/skuska'},'Na záverečnú skúšku'):null)));
    if(nove)beep(1,tich);if(!tich){konfety();chvala('Šukar!')}const r=$('.rol',document);if(r)r.innerHTML=koleso({ok:hotove()});};
  dal()}

/* skúška */
function skuska(){
  const lv=S.lv,CFG={a:{n:8,min:0},b:{n:15,min:12},c:{n:20,min:15}}[lv],st=el('div',{cls:'str'});
  const spat=el('a',{cls:'ik spat',href:'#/','aria-label':'Späť na koleso',html:IK.spat});
  st.append(spat,el('h1',{},'Záverečná skúška'));
  const pl=el('div');st.append(pl);ukaz(st);
  const pc=hotove().length;
  pl.append(el('p',{},`${CFG.n} ${sk(CFG.n,'otázka','otázky','otázok')}${CFG.min?`, ${CFG.min} minút`:', bez časomiery'}, jeden pokus na otázku. Otázky sú zo všetkých piatich oblastí. Téma Pamäť sa v skúške nehodnotí.`),
    el('p',{},pc<16?`Na kolese máš ${pc} zo 16 lúčov. Skúšku môžeš spustiť aj teraz, no lepšie ti pôjde po dokončení zastávok.`:'Máš hotové celé koleso.'),
    el('label',{},'Tvoje meno na osvedčení',el('input',{cls:'vst',id:'men',value:S.meno||'',maxlength:40,autocomplete:'off',style:'margin:.3em 0 1em'})),
    el('button',{cls:'tl',on:{click:()=>{S.meno=$('#men').value.trim();uloz();start()}}},'Začať skúšku'));
  function start(){
    const zas=Z.filter(z=>!z.ticho),pool=[];
    zas.forEach(z=>z.otazky.filter(q=>q.l.includes(lv)).forEach(q=>pool.push({...q,s:z.s})));
    const na=Math.floor(CFG.n/5),vyb=[];Object.keys(SEKTORY).forEach(s=>vyb.push(...shuffle(pool.filter(q=>q.s===s)).slice(0,na)));
    const zv=shuffle(pool.filter(q=>!vyb.includes(q)));while(vyb.length<CFG.n&&zv.length)vyb.push(zv.pop());
    const qs=shuffle(vyb);let n=0,sp={},cl={},t=CFG.min*60,tm=null;
    Object.keys(SEKTORY).forEach(s=>{sp[s]=0;cl[s]=0});
    const cas=el('div',{cls:'cas','aria-live':'off'});
    const tik=()=>{if(!CFG.min||document.hidden)return;const m=Math.floor(t/60),s=String(t%60).padStart(2,'0');cas.textContent=`Zostáva ${m}:${s}`;if(t<=0){clearInterval(tm);vys(qs)}t--};
    if(CFG.min){tm=setInterval(()=>{if(!cas.isConnected){clearInterval(tm);return}tik()},1000);tik()}
    const dal=()=>{if(n>=qs.length){clearInterval(tm);return vys(qs)}const q=qs[n];
      const r=el('div',{cls:'mc'});pl.replaceChildren(cas,el('p',{cls:'mal'},`Otázka ${n+1} z ${qs.length}, ${SEKTORY[q.s]}`),el('p',{cls:'otz'},q.q),r);
      shuffle(q.a.map((x,i)=>[x,i])).forEach(([x,i])=>{r.append(ch(x,0,()=>{q.ans=i===0?1:2;if(i===0)sp[q.s]++;n++;dal()}))})};
    const vys=()=>{qs.forEach(q=>cl[q.s]++);const sum=Object.values(sp).reduce((a,b)=>a+b,0),pct=Math.round(sum/qs.length*100),pre=pct>=60;
      if(pre&&!(S.skuska[lv]>=pct)){S.skuska[lv]=pct;uloz()}
      st.replaceChildren(spat,el('h1',{},pre?'Skúška je hotová':'Skoro hotovo'));
      const b=el('div');st.append(b);
      b.append(el('p',{},`Správne odpovede: ${sum} z ${qs.length}, teda ${pct} %.`));
      Object.keys(SEKTORY).forEach(s=>{if(!cl[s])return;b.append(el('div',{cls:'obl'},SEKTORY[s],el('div',{cls:'t'},el('i',{style:`width:${sp[s]/cl[s]*100}%`})),`${sp[s]}/${cl[s]}`))});
      const naOpak=qs.filter(q=>q.ans!==1);
      if(naOpak.length)b.append(el('h2',{},'Na toto sa oplatí pozrieť'),el('ul',{cls:'opak'},...naOpak.map(q=>el('li',{},el('b',{html:tx(q.q)}),el('span',{html:` Správne: ${tx(q.a[0])}. `}),el('span',{html:tx(q.w)})))));
      if(pre){const dt=new Date().toLocaleDateString('sk-SK');
        b.append(el('div',{cls:'cert'},el('p',{},'Osvedčenie'),el('h2',{},'Romano drom'),
          el('div',{html:koleso({vsetko:1})}),
          el('div',{cls:'men'},S.meno||'Cestovateľ'),
          el('p',{},`prešiel alebo prešla cestou rómskych dejín, jazyka a kultúry na úrovni ${UROVNE[lv].n}. Výsledok ${pct} %, ${dt}.`),
          el('p',{html:'<i lang="rom">Bachtalo tiro drom!</i> Šťastnú cestu!'})),
          el('div',{cls:'akc'},el('button',{cls:'tl',on:{click:()=>print()}},'Vytlačiť osvedčenie'),el('a',{cls:'tl dru',href:'#/'},'Na koleso')))}
      else b.append(el('p',{},'Na osvedčenie treba aspoň 60 %. Pozri sa na oblasti s kratším pruhom a skús to znova. Otázky sa zmenia.'),
          el('div',{cls:'akc'},el('button',{cls:'tl',on:{click:()=>skuska()}},'Skúsiť znova'),el('a',{cls:'tl dru',href:'#/'},'Na koleso')))};
    dal()}
}
